.default_script: &default_script
  when: manual
  allow_failure: false
  script:
    - ruby -v
    - bundle exec rake wwtd:local

cache:
  untracked: true
  paths:
    - .bundle/
    - vendor/bundle/

before_script:
  - export LANG=C.UTF-8 LC_ALL=C.UTF-8
  - ruby -e 'abort "UTF-8 locale is not active" unless Encoding.default_external == Encoding::UTF_8'
  - rm -f Gemfile.lock
  - gem update --system 3.3.26
  - bundle config --local path vendor/bundle
  - 'CI=true bundle install --quiet --jobs "$(nproc)" "${FLAGS[@]}"'

ruby-2.3.8:
  image: ruby:2.3.8
  <<: *default_script

ruby-2.4.10:
  image: ruby:2.4.10
  <<: *default_script

ruby-2.5.9:
  image: ruby:2.5.9
  <<: *default_script

ruby-2.6.10:
  image: ruby:2.6.10
  <<: *default_script

ruby-2.7.8:
  image: ruby:2.7.8
  <<: *default_script

